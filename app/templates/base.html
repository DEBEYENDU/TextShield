<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - {{ tagline }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" type="image/svg+xml"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2322d3ee' d='M12 2l8 3v6c0 5-3.5 9.4-8 11-4.5-1.6-8-6-8-11V5l8-3z'/%3E%3C/svg%3E">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="/">
                <svg class="brand-shield" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2l8 3v6c0 5-3.5 9.4-8 11-4.5-1.6-8-6-8-11V5l8-3z"/>
                    <path class="brand-core" d="M12 7l4.5 1.8v3.4c0 2.9-1.9 5.4-4.5 6.4-2.6-1-4.5-3.5-4.5-6.4V8.8L12 7z"/>
                </svg>
                <span class="brand-name">TEXTSHIELD</span>
            </a>
            <nav class="nav">
                <a href="/" data-nav="analyze">Analyze</a>
                <a href="/history" data-nav="history">History</a>
                <a href="/analytics" data-nav="analytics">Analytics</a>
                <a href="/knowledge-base" data-nav="kb">Knowledge Base</a>
                <a href="/about" data-nav="about">About</a>
            </nav>
        </header>

        <main class="content">
            {% block content %}{% endblock %}
        </main>

        <footer class="footer">
            {{ title }} &middot; {{ tagline }}
            <span class="footer-note">Machine learning &middot; RAG &middot; Explainable analysis &middot; Informational only</span>
        </footer>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
