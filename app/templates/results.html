{% extends "base.html" %}
{% block content %}
<div class="page-head">
    <h1>Analysis Results <span class="accent">Detailed</span></h1>
    <p>Complete analysis of the message with full explainability.</p>
</div>

<div class="row" style="margin: -0.5rem -0.5rem 1.5rem;">
    <div class="col-8">
        <div class="card">
            <div class="card-header">
                <h3>Original Message</h3>
            </div>
            <div class="card-body">
                <p id="original-message" class="mb-0"></p>
            </div>
        </div>
    </div>
    
    <div class="col-4">
        <div class="card">
            <div class="card-header">
                <h3>Classification</h3>
            </div>
            <div class="card-body text-center">
                <div id="classification-badge" class="risk-badge"></div>
                <p id="classification-text" style="margin-top: 0.5rem; font-size: 1.25rem; font-weight: 600;"></p>
            </div>
        </div>
    </div>
</div>

<div class="row" style="margin: -0.5rem -0.5rem 1.5rem;">
    <div class="col-6">
        <div class="card">
            <div class="card-header">
                <h3>Summary</h3>
            </div>
            <div class="card-body" id="summary-text"></div>
        </div>
    </div>
    
    <div class="col-6">
        <div class="card">
            <div class="card-header">
                <h3>Reasoning</h3>
            </div>
            <div class="card-body" id="reasoning-text"></div>
        </div>
    </div>
</div>

<div class="row" style="margin: -0.5rem -0.5rem 1.5rem;">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h3>Supporting Evidence</h3>
            </div>
            <div class="card-body" id="evidence-list"></div>
        </div>
    </div>
</div>

<div class="row" style="margin: -0.5rem -0.5rem 1.5rem;">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h3>Recommendations</h3>
            </div>
            <div class="card-body" id="recommendations-list"></div>
        </div>
    </div>
</div>

<div class="mt-3">
    <button class="btn" onclick="exportResults()">Export</button>
    <button class="btn btn-secondary" onclick="window.history.back()">Back</button>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/results.js"></script>
{% endblock %}
