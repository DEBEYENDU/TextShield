{% extends "base.html" %}
{% block content %}
<div class="page-head">
    <h1>Analysis History <span class="accent">Previous</span></h1>
    <p>Previous analyses with filters and search.</p>
</div>

<div class="card">
    <div class="table-responsive">
        <table class="data">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Message Type</th>
                    <th>Classification</th>
                    <th>Risk Level</th>
                    <th>Confidence</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="history-table-body">
                <!-- History rows loaded via AJAX -->
            </tbody>
        </table>
    </div>
</div>

<div class="card">
    <div class="stat-grid" id="history-stats">
        <!-- Stats loaded via AJAX -->
    </div>
</div>

<div class="mt-3">
    <button class="btn" onclick="exportHistory()">Export History</button>
    <button class="btn btn-secondary" onclick="deleteSelected()">Delete Selected</button>
    <button class="btn btn-secondary" onclick="reanalyzeSelected()">Reanalyze Selected</button>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/history.js"></script>
{% endblock %}
