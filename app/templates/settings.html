{% extends "base.html" %}
{% block content %}
<div class="page-head">
    <h1>Settings <span class="accent">Preferences</span></h1>
    <p>Configure TextShield preferences and connections.</p>
</div>

<div class="grid grid-2" style="margin-top: 1rem; gap: 1.5rem;">
    <div class="card">
        <h3>Theme</h3>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="theme" id="theme-light" checked>
            <label class="form-check-label" for="theme-light">Light</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="theme" id="theme-dark">
            <label class="form-check-label" for="theme-dark">Dark</label>
        </div>
    </div>
    
    <div class="card">
        <h3>LLM Provider</h3>
        <div class="form-select">
            <select id="llm-provider">
                <option value="openai">OpenAI</option>
                <option value="anthropic">Anthropic</option>
                <option value="ollama">Ollama (Local)</option>
                <option value="gemini">Google Gemini</option>
            </select>
        </div>
    </div>
    
    <div class="card">
        <h3>Embedding Model</h3>
        <div class="form-select">
            <select id="embedding-model">
                <option value="sentence-transformers/all-MiniLM-L6-v2">all-MiniLM-L6-v2</option>
                <option value="sentence-transformers/all-MPNet-base-v2">all-MPNet-base-v2</option>
                <option value="sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2">paraphrase-multilingual-MiniLM-L12-v2</option>
            </select>
        </div>
    </div>
    
    <div class="card">
        <h3>Confidence Thresholds</h3>
        <div class="grid grid-2">
            <div>
                <label>Spam threshold</label>
                <input type="range" id="spam-threshold" min="0.1" max="0.9" step="0.1" value="0.5">
                <span id="spam-threshold-value">0.5</span>
            </div>
            <div>
                <label>Risk threshold</label>
                <input type="range" id="risk-threshold" min="0.1" max="0.9" step="0.1" value="0.3">
                <span id="risk-threshold-value">0.3</span>
            </div>
        </div>
    </div>
</div>

<div class="card" style="margin-top: 1rem;">
    <h3>Decision Thresholds</h3>
    <div class="grid grid-2">
        <div>
            <label>High confidence</label>
            <input type="range" id="high-confidence" min="0.5" max="0.99" step="0.01" value="0.7">
            <span id="high-confidence-value">0.7</span>
        </div>
        <div>
            <label>Medium confidence</label>
            <input type="range" id="medium-confidence" min="0.1" max="0.5" step="0.01" value="0.4">
            <span id="medium-confidence-value">0.4</span>
        </div>
    </div>
</div>
</div>

<div class="mt-3">
    <button class="btn" onclick="saveSettings()">Save Settings</button>
    <button class="btn btn-secondary" onclick="resetSettings()">Reset</button>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/settings.js"></script>
{% endblock %}
